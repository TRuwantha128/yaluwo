<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yaluwo: create and join group trips across Sri Lanka, split the costs, and travel with people who travel like you." />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/mark-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
    <title>Yaluwo · Travel Sri Lanka together</title>
    <script>
      // Apply the saved theme before the page paints, so there is no colour flash
      try {
        var t = JSON.parse(localStorage.getItem('yaluwo.theme.v1'))
        if (t) {
          var r = document.documentElement
          r.style.setProperty('--brand', t.brand)
          r.style.setProperty('--accent', t.accent)
          r.dataset.mode = t.mode
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
